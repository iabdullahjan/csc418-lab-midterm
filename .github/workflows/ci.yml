name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    # Runs on the self-hosted runner on our own PC, so localhost is our PC
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=results.xml

      - name: Build JSON test report
        if: always()
        run: python ci/make_report.py results.xml

      - name: Send report to local receiver
        if: always()
        run: Invoke-RestMethod -Uri http://localhost:5050/report -Method Post -ContentType "application/json" -InFile test-report.json

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.json

      # Bonus: only runs when the REPORT_EMAIL repository variable is set
      - name: Email test report
        if: always() && vars.REPORT_EMAIL != ''
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI ${{ job.status }}: ${{ github.repository }} @ ${{ github.sha }}"
          to: ${{ vars.REPORT_EMAIL }}
          from: CSC418 CI <${{ secrets.MAIL_USERNAME }}>
          body: file://test-report.json
          attachments: test-report.json

  # Bonus: publish the static demo only when all tests passed on main
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
